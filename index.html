<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>pages · 3dot141</title>
<style>
:root{
  --paper:#F7F6F3; --card:#FFFFFF; --line:#EAEAEA;
  --ink:#1F2427; --ink-2:#6A6A66; --ink-3:#8C8B87;
}
[data-theme="dark"]{
  --paper:#191919; --card:#202020; --line:#2E2E2E;
  --ink:#F0EEEA; --ink-2:#A8A6A2; --ink-3:#7C7A76;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:16px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding:64px 20px 96px}
h1{font-family:Georgia,"Songti SC",serif;font-size:28px;font-weight:600;margin:0 0 8px;letter-spacing:-.01em}
.sub{color:var(--ink-3);font-size:13px;margin:0 0 40px}
h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);margin:28px 0 12px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;margin:0 0 10px;text-decoration:none;color:inherit;
  transition:border-color .16s,transform .1s}
a.card:hover{border-color:var(--hairline,var(--line));transform:translateY(-1px)}
a.card:active{transform:scale(.995)}
.title{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 3px}
.desc{font-size:13px;color:var(--ink-3);margin:0}
.foot{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--ink-3)}
</style>
</head>
<body>
<div class="wrap">
  <h1>pages</h1>
  <p class="sub">按目录区分的静态页面托管</p>

  <h2>Sapling</h2>
  <a class="card" href="sapling/privacy.html">
    <p class="title">隐私政策</p>
    <p class="desc">App Store 审核所需的隐私政策</p>
  </a>
  <a class="card" href="sapling/support.html">
    <p class="title">支持</p>
    <p class="desc">常见问题与联系方式</p>
  </a>
  <a class="card" href="sapling/terms.html">
    <p class="title">服务条款</p>
    <p class="desc">使用条件与责任说明</p>
  </a>

  <p class="foot">由 GitHub Pages 托管 · <a href="https://github.com/3dot141/pages">3dot141/pages</a></p>
</div>
<script>
try{
  var t=localStorage.getItem("theme")||"auto";
  var d=(t==="dark")||(t==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches);
  document.documentElement.dataset.theme=d?"dark":"light";
}catch(e){}
</script>
</body>
</html>
